<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hồ cá vui nhộn</title>
  <link rel="stylesheet" href="mystyle.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: url("../Img&Vid/faintSchool.png") repeat-x;
      background-size: cover;
      animation: backgroundMove 60s linear infinite;
    }

    @keyframes backgroundMove {
      from {
        background-position: 0 0;
      }
      to {
        background-position: -1000px 0;
      }
    }

    .aquarium {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .fish {
      position: absolute;
      width: 100px;
      height: auto;
    }

    .btn-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 999;
    }

    button {
      padding: 10px 15px;
      font-size: 14px;
      border: none;
      background-color: #007BFF;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  
  <div class="btn-container">
    <button onclick="changeBackground()">Đổi cảnh biển</button>
    <button onclick="toggleMusic()">Phát / Dừng nhạc</button>
  </div>
 <audio id="bgMusic" loop>
    <source src="../Img&Vid/music.mp3" type="audio/mpeg">
  </audio>
  <div class="aquarium">
    <img src="../Img&Vid/shark.png" class="fish" id="shark">
    <img src="../Img&Vid/turtle.png" class="fish" id="turtle">
    <img src="../Img&Vid/diver1.png" class="fish" id="diver1">
    <img src="../Img&Vid/diver2.png" class="fish" id="diver2">
    <img src="../Img&Vid/diver3.png" class="fish" id="diver3">
    <img src="../Img&Vid/goldFishSchool.png" class="fish" id="school">
  </div>

  <script>
    const fishes = [
      { id: 'shark', dx: 2, dy: 2 },
      { id: 'turtle', dx: 1.5, dy: 1.2 },
      { id: 'diver1', dx: 1.3, dy: 1.7 },
      { id: 'diver2', dx: 1.8, dy: 1.4 },
      { id: 'diver3', dx: 2.2, dy: 1.6 },
      { id: 'school', dx: 1.6, dy: 2.1 }
    ];

    fishes.forEach(fish => {
      const el = document.getElementById(fish.id);
      fish.el = el;
      fish.x = Math.random() * (window.innerWidth - 100);
      fish.y = Math.random() * (window.innerHeight - 100);
      el.style.left = fish.x + 'px';
      el.style.top = fish.y + 'px';
    });

    function moveFish() {
      fishes.forEach(fish => {
        fish.x += fish.dx;
        fish.y += fish.dy;

        if (fish.x <= 0 || fish.x >= window.innerWidth - 100) {
          fish.dx = -fish.dx;
          fish.el.style.transform = fish.dx > 0 ? 'scaleX(1)' : 'scaleX(-1)';
        }
        if (fish.y <= 0 || fish.y >= window.innerHeight - 100) {
          fish.dy = -fish.dy;
        }

        fish.el.style.left = fish.x + 'px';
        fish.el.style.top = fish.y + 'px';
      });

      requestAnimationFrame(moveFish);
    }

    moveFish();

    const backgrounds = [
      "../Img&Vid/faintSchool.png",
      "../Img&Vid/anhnen1.jpg",
      "../Img&Vid/anhnen2.jpg",
      "../Img&Vid/anhnen3.jpg"
    ];
    let currentBg = 0;

    function changeBackground() {
      currentBg = (currentBg + 1) % backgrounds.length;
      const body = document.body;
      const bg = backgrounds[currentBg];

      body.style.backgroundImage = `url('${bg}')`;

      if (bg.includes("faintSchool")) {
        body.style.backgroundRepeat = "repeat-x";
        body.style.animation = "backgroundMove 60s linear infinite";
      } else {
        body.style.backgroundRepeat = "no-repeat";
        body.style.backgroundSize = "cover";
        body.style.animation = "none";
      }
    }
    function toggleMusic() {
  const music = document.getElementById("bgMusic");
  if (music.paused) {
    music.play();
  } else {
    music.pause();
  }
}
  </script>
  
</body>
</html>
